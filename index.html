<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trip budget</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2B4C9B">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{color-scheme:light dark;--bg:#EEF1F5;--surf:#fff;--ink:#16213A;--mut:#5B6577;--line:#D7DCE5;--acc:#2B4C9B;--accfg:#fff;--ok:#2F7D5A;--warn:#A86A0F;--over:#C0392B;--track:#E3E8F0}
@media (prefers-color-scheme:dark){:root{--bg:#0E1424;--surf:#172036;--ink:#E8ECF4;--mut:#9AA5BA;--line:#29334F;--acc:#86A8FF;--accfg:#0E1424;--ok:#5FBF92;--warn:#E0B04F;--over:#FF7B6B;--track:#26304B}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;max-width:560px;margin:0 auto}
header b{font-size:18px;letter-spacing:.2px}
main{max-width:560px;margin:0 auto;padding:4px 16px calc(96px + env(safe-area-inset-bottom))}
h1{font-size:22px;margin:8px 0 12px}
h2{font-size:15px;margin:22px 0 8px;display:flex;justify-content:space-between;align-items:baseline;font-weight:650}
h2 span{font-weight:500;color:var(--mut);font-size:14px}
.muted{color:var(--mut)}.small{font-size:13px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
input,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;min-height:44px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
label:first-child{margin-top:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.seg button{border:0;background:transparent;padding:8px 14px;min-height:40px;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--acc);color:var(--accfg)}
.amtrow{display:flex;gap:8px;align-items:stretch}
.amtrow input{font-size:22px;font-weight:650}
.amtrow .seg{flex:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.btnrow{display:flex;gap:8px;margin-top:6px}
.btnrow button,.btn{flex:1;border:1px solid var(--line);background:var(--surf);border-radius:12px;padding:13px;font-weight:600;min-height:48px}
.primary{background:var(--acc)!important;color:var(--accfg)!important;border-color:var(--acc)!important}
.danger{color:var(--over);background:var(--surf);border:1px solid var(--line);border-radius:10px;min-height:44px}
.hero{padding:18px 16px}
.hero .lbl{color:var(--mut);font-size:14px}
.hero .big{font-size:44px;font-weight:700;line-height:1.1;margin:2px 0}
.hero .sub{color:var(--mut)}
.bar{height:8px;border-radius:99px;background:var(--track);overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--ok)}
.warn .bar i,.bar.warn i{background:var(--warn)}.over .bar i,.bar.over i{background:var(--over)}
.bar.split{display:flex}.bar.split i{border-radius:0;flex:none}
.bar.split i.p{background:var(--acc)}.bar.split i.s{background:var(--ok)}
.bar.split.warn i.s{background:var(--warn)}.bar.split.over i.s{background:var(--over)}
.card.hero{color:var(--ink)}
.linkbtn{border:0;background:none;color:var(--acc);font-weight:600;padding:10px 0 0;min-height:36px;font-size:15px}
.paidrow{display:flex;justify-content:space-between;padding:7px 0}.paidrow+.paidrow{border-top:1px solid var(--line)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.over{color:var(--over)}
.cat{display:block;width:100%;text-align:left;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.cat-top{display:flex;justify-content:space-between;gap:10px;font-weight:600}
.cat-sub{display:flex;justify-content:space-between;color:var(--mut);font-size:13px}
.cat .bar{margin:8px 0 6px}
.cat.warn .bar i{background:var(--warn)}.cat.over .bar i{background:var(--over)}
.cat.warn,.cat.over,.cat.ok{color:inherit}
.cat .amt.ok{color:var(--ok)}.cat .amt.warn{color:var(--warn)}.cat .amt.over{color:var(--over)}
.pv-label{color:var(--mut);font-size:14px}
.pv-big{font-size:40px;font-weight:700;line-height:1.1}
.pv-line{color:var(--mut);margin:2px 0 10px;min-height:1.4em}
.pv-rows div{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line);font-size:15px}
.day{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;margin:16px 2px 6px;font-weight:600}
.exp{display:grid;grid-template-columns:1fr auto;gap:2px 12px;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.exp-desc{font-weight:600;overflow-wrap:anywhere}
.exp-meta{color:var(--mut);font-size:13px}
.exp-amt{text-align:right;grid-row:1/3;grid-column:2}
.exp-amt b{display:block}.exp-amt small{color:var(--mut)}
.exp-act{grid-column:1/3;display:flex;gap:14px;margin-top:4px}
.exp-act button{border:0;background:none;color:var(--acc);padding:6px 0;font-size:14px;font-weight:600;min-height:32px}
.exp-act .d{color:var(--over)}
.empty{text-align:center;padding:36px 12px;color:var(--mut)}
.empty .btn{margin-top:14px;max-width:260px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surf);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{border:0;background:none;padding:14px 4px;font-weight:600;color:var(--mut);min-height:52px;border-top:3px solid transparent}
nav button.on{color:var(--acc);border-top-color:var(--acc)}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .15s;z-index:9}
#toast.show{opacity:1}
.banner{background:var(--over);color:#fff;padding:10px 16px;font-size:14px;text-align:center}
.banner.soft{background:var(--warn);color:var(--bg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="banner"></div>
<header><b>Trip budget</b><div class="seg" id="hdr-seg"></div></header>
<main id="app"></main>
<nav><div>
  <button data-tab="summary">Summary</button>
  <button data-tab="add">Add</button>
  <button data-tab="log">Log</button>
  <button data-tab="budget">Budget</button>
</div></nav>
<div id="toast"></div>
<input type="file" id="imp" accept="application/json,.json" hidden>
<noscript>This page needs JavaScript enabled.</noscript>
<script>
(function(){
'use strict';
const KEY='tripbudget.v1';
const $=s=>document.querySelector(s);
const app=$('#app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const defaults=()=>({total:0,rate:110,display:'CAD',lastCur:'JPY',cats:[],exps:[]});

let storageOK=true;
try{localStorage.setItem('__t','1');localStorage.removeItem('__t');}catch(e){storageOK=false;}
let lastRaw=null;
function load(){
  let d=null;
  try{const r=localStorage.getItem(KEY);if(r){d=Object.assign(defaults(),JSON.parse(r));lastRaw=r;}}catch(e){}
  if(!d)d=defaults();
  return d;
}
function save(){
  try{lastRaw=JSON.stringify(S);localStorage.setItem(KEY,lastRaw);}catch(e){storageOK=false;}
  banner();
}
function banner(){
  let h='';
  if(!storageOK)h='<div class="banner">This browser is not saving data. Use Budget → Export backup often.</div>';
  else if(/^(file|content):$/.test(location.protocol))h='<div class="banner soft">Opened as a local file, so saved data may not stick. Use the hosted app, or export backups.</div>';
  $('#banner').innerHTML=h;
}

let S=load();
let tab='summary', editing=null, filterCat='all', showNew=false;
let draft={amount:'',cur:S.lastCur||'JPY',cat:'',desc:'',when:''};

/* ---------- money helpers ---------- */
const toCad=(a,cur)=>cur==='CAD'?a:a/S.rate;
const catBudget=c=>toCad(c.budget,c.cur);
const expSpent=id=>S.exps.filter(e=>e.cat===id).reduce((t,e)=>t+toCad(e.amount,e.cur),0);
const spentOf=c=>c.type==='paid'?catBudget(c):expSpent(c.id);
function totals(){
  const paid=S.cats.filter(c=>c.type==='paid').reduce((t,c)=>t+catBudget(c),0);
  const go=S.cats.filter(c=>c.type!=='paid');
  const alloc=go.reduce((t,c)=>t+catBudget(c),0);
  const spent=go.reduce((t,c)=>t+expSpent(c.id),0);
  const tb=S.total;
  return {tb,paid,alloc,spent,rem:tb-paid-spent,unalloc:tb-paid-alloc};
}
function money(cad,cur){
  cur=cur||S.display;
  if(Math.abs(cad)<0.005)cad=0;
  const neg=cad<0,v=Math.abs(cad);
  const s=cur==='JPY'?'¥'+Math.round(v*S.rate).toLocaleString('en-CA'):'$'+v.toLocaleString('en-CA',{minimumFractionDigits:2,maximumFractionDigits:2});
  return (neg?'−':'')+s;
}
const otherCur=()=>S.display==='CAD'?'JPY':'CAD';
function amountLabel(a,cur){
  return cur==='JPY'?'¥'+Math.round(a).toLocaleString('en-CA'):'$'+a.toLocaleString('en-CA',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function num(s,cur){
  s=String(s).replace(/[\s¥$]/g,'');
  if(cur==='JPY'||s.includes('.'))s=s.replace(/,/g,'');else s=s.replace(',','.');
  const v=parseFloat(s);return isFinite(v)?v:NaN;
}
function status(spent,budget){
  if(spent>budget+0.005)return 'over';
  if(budget>0&&spent/budget>=0.85)return 'warn';
  return 'ok';
}
const pct=(spent,budget)=>budget>0?Math.min(100,spent/budget*100):(spent>0?100:0);
const leftText=v=>v<-0.005?money(-v)+' over':money(v)+' left';
function nowLocal(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16);}
function toLocalInput(iso){const d=new Date(iso);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16);}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1800);}

/* ---------- views ---------- */
function emptyCats(msg){
  return `<div class="empty"><p>${msg}</p><button class="btn primary" data-tab="budget">Set up categories</button></div>`;
}
function catCard(c){
  const b=catBudget(c),sp=spentOf(c),rem=b-sp,st=status(sp,b);
  return `<button class="cat ${st}" data-act="pick" data-id="${c.id}">
    <div class="cat-top"><span>${esc(c.name)}</span><span class="amt ${st}">${leftText(rem)}</span></div>
    <div class="bar"><i style="width:${pct(sp,b)}%"></i></div>
    <div class="cat-sub"><span>${money(sp)} spent</span><span>of ${money(b)}</span></div>
  </button>`;
}
function viewSummary(){
  if(!S.cats.length)return emptyCats('No categories yet. Add what you have already paid, then budget the rest.');
  const t=totals(),st=status(t.paid+t.spent,t.tb);
  const go=S.cats.filter(c=>c.type!=='paid'),pd=S.cats.filter(c=>c.type==='paid');
  const w=v=>t.tb>0?Math.min(100,Math.max(0,v/t.tb*100)):0;
  const pw=w(t.paid),sw=Math.min(100-pw,w(t.spent));
  const row=(l,v,cls)=>`<div><span>${l}</span><span class="${cls||''}">${v}</span></div>`;
  const over=t.unalloc<-0.005;
  return `<div class="card hero ${st}">
    <div class="lbl">${t.rem<0?'Over budget by':'Left to spend'}</div>
    <div class="big ${st}">${money(Math.abs(t.rem))}</div>
    <div class="sub">≈ ${money(Math.abs(t.rem),otherCur())}</div>
    <div class="bar split ${st}"><i class="p" style="width:${pw}%"></i><i class="s" style="width:${sw}%"></i></div>
    <div class="pv-rows">
      ${row('Trip budget',money(t.tb))}
      ${row('Already paid',money(t.paid))}
      ${row('Spent on the go',money(t.spent))}
      ${row(over?'Over-allocated by':'Not yet allocated',money(Math.abs(t.unalloc)),over?'over':'')}
    </div>
  </div>
  ${go.length?`<h2>On the go<span>${money(t.alloc)} budgeted</span></h2>${go.map(catCard).join('')}`:'<p class="muted">Add on-the-go categories in the Budget tab.</p>'}
  ${pd.length?`<h2>Already paid<span>${money(t.paid)}</span></h2><div class="card">${pd.map(c=>`<div class="paidrow"><span>${esc(c.name)}</span><span>${money(catBudget(c))}</span></div>`).join('')}</div>`:''}
  <button class="btn" style="width:100%;margin-top:6px" data-act="gotonew">+ Add category</button>
  <p class="muted small" style="margin-top:18px">Rate: 1 CAD = ¥${S.rate}. Tap an on-the-go category to add an expense to it.</p>`;
}
function viewAdd(){
  const go=S.cats.filter(c=>c.type!=='paid');
  if(!go.length)return emptyCats('Add on-the-go categories with a budget before logging expenses.');
  if(!go.find(c=>c.id===draft.cat))draft.cat=go[0].id;
  if(!draft.when)draft.when=nowLocal();
  const opt=c=>`<option value="${c.id}" ${c.id===draft.cat?'selected':''}>${esc(c.name)} — ${leftText(catBudget(c)-expSpent(c.id))}</option>`;
  const sel=go.map(opt).join('');
  return `<h1>${editing?'Edit expense':'Add expense'}</h1>
  <div class="card" id="preview"></div>
  <div class="card">
    <label for="f-amount">Amount</label>
    <div class="amtrow">
      <input id="f-amount" inputmode="decimal" autocomplete="off" placeholder="0" value="${esc(draft.amount)}">
      <div class="seg" id="f-cur">
        <button data-act="curpick" data-v="JPY" class="${draft.cur==='JPY'?'on':''}">JPY</button>
        <button data-act="curpick" data-v="CAD" class="${draft.cur==='CAD'?'on':''}">CAD</button>
      </div>
    </div>
    <label for="f-cat">Category</label>
    <select id="f-cat">${sel}</select>
    <button type="button" class="linkbtn" data-act="newcat-toggle">${showNew?'Cancel new category':'+ New category'}</button>
    ${showNew?`<div class="two" style="margin-top:6px"><input id="qc-name" placeholder="Category name" maxlength="40" autocomplete="off"><input id="qc-amt" inputmode="decimal" placeholder="Budget (CAD)"></div><button type="button" class="btn primary" style="width:100%;margin-top:8px" data-act="qcreate">Create category</button>`:''}
    <label for="f-desc">Description</label>
    <input id="f-desc" maxlength="80" autocomplete="off" placeholder="e.g. Wool coat" value="${esc(draft.desc)}">
    <label for="f-when">When</label>
    <input id="f-when" type="datetime-local" value="${esc(draft.when)}">
  </div>
  <div class="btnrow">
    <button class="primary" data-act="save">${editing?'Save changes':'Save expense'}</button>
    ${editing?'<button data-act="cancel">Cancel</button>':''}
  </div>`;
}
function updatePreview(){
  const el=$('#preview');if(!el)return;
  const cat=S.cats.find(c=>c.id===draft.cat);
  if(!cat){el.innerHTML='<div class="muted">Pick a category.</div>';return;}
  const amt=num(draft.amount,draft.cur);
  const add=isFinite(amt)&&amt>0?toCad(amt,draft.cur):0;
  const ex=editing?S.exps.find(x=>x.id===editing):null;
  const exCad=ex?toCad(ex.amount,ex.cur):0;
  const exIn=ex&&ex.cat===cat.id?exCad:0;
  const catLeft=catBudget(cat)-(expSpent(cat.id)-exIn);
  const catAfter=catLeft-add;
  const tripAfter=totals().rem+exCad-add;
  const st=catAfter<-0.005?'over':(catAfter<catBudget(cat)*0.15?'warn':'ok');
  const tst=tripAfter<-0.005?'over':'ok';
  const conv=add>0?`${amountLabel(amt,draft.cur)} ≈ ${money(add,draft.cur==='JPY'?'CAD':'JPY')}`:'Enter an amount to preview';
  el.innerHTML=`<div class="pv-label">${catAfter<-0.005?'Over '+esc(cat.name)+' budget by':'Left in '+esc(cat.name)+' after this'}</div>
    <div class="pv-big ${st}">${money(Math.abs(catAfter))}</div>
    <div class="pv-line">${conv}</div>
    <div class="pv-rows">
      <div><span>${esc(cat.name)} now</span><span>${leftText(catLeft)}</span></div>
      <div><span>Whole trip after</span><span class="${tst}">${leftText(tripAfter)}</span></div>
    </div>`;
}
function viewLog(){
  if(!S.exps.length)return `<h1>Log</h1><div class="empty">No expenses yet.</div>`;
  const list=S.exps.filter(e=>filterCat==='all'||e.cat===filterCat).sort((a,b)=>b.ts.localeCompare(a.ts));
  const opts=`<option value="all">All categories</option>`+S.cats.map(c=>`<option value="${c.id}" ${filterCat===c.id?'selected':''}>${esc(c.name)}</option>`).join('');
  const days=[];
  list.forEach(e=>{
    const k=new Date(e.ts).toLocaleDateString([], {weekday:'short',month:'short',day:'numeric'});
    let d=days[days.length-1];if(!d||d.k!==k){d={k,items:[],tot:0};days.push(d);}
    d.items.push(e);d.tot+=toCad(e.amount,e.cur);
  });
  const tot=list.reduce((t,e)=>t+toCad(e.amount,e.cur),0);
  const row=e=>{
    const c=S.cats.find(c=>c.id===e.cat);
    const alt=e.cur==='JPY'?money(toCad(e.amount,e.cur),'CAD'):money(toCad(e.amount,e.cur),'JPY');
    const time=new Date(e.ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    return `<div class="exp">
      <div class="exp-desc">${esc(e.desc||'(no description)')}</div>
      <div class="exp-amt"><b>${amountLabel(e.amount,e.cur)}</b><small>${alt}</small></div>
      <div class="exp-meta">${esc(c?c.name:'?')} · ${time}</div>
      <div class="exp-act"><button data-act="edit" data-id="${e.id}">Edit</button><button class="d" data-act="del" data-id="${e.id}">Delete</button></div>
    </div>`;};
  return `<h1>Log</h1>
  <select id="filter">${opts}</select>
  <p class="muted small" style="margin:8px 2px 0">${list.length} expense${list.length===1?'':'s'} · ${money(tot)}</p>
  ${days.map(d=>`<div class="day"><span>${d.k}</span><span>${money(d.tot)}</span></div>${d.items.map(row).join('')}`).join('')}`;
}
function allocHtml(){
  const t=totals(),over=t.unalloc<-0.005;
  return `<div><span>Already paid</span><span>${money(t.paid)}</span></div>
  <div><span>On-the-go budgets</span><span>${money(t.alloc)}</span></div>
  <div><span>${over?'Over-allocated by':'Not yet allocated'}</span><span class="${over?'over':'ok'}">${money(Math.abs(t.unalloc))}</span></div>`;
}
function refreshAlloc(){const el=document.getElementById('alloc');if(el)el.innerHTML=allocHtml();}
function viewBudget(){
  const typeOpts=v=>`<option value="go" ${v!=='paid'?'selected':''}>On the go</option><option value="paid" ${v==='paid'?'selected':''}>Already paid</option>`;
  const curOpts=v=>`<option value="CAD" ${v==='CAD'?'selected':''}>CAD</option><option value="JPY" ${v==='JPY'?'selected':''}>JPY</option>`;
  const row=c=>`<div class="card">
    <input data-cid="${c.id}" data-f="name" value="${esc(c.name)}" aria-label="Category name">
    <div class="two"><input data-cid="${c.id}" data-f="budget" inputmode="decimal" value="${c.budget}" aria-label="Amount"><select data-cid="${c.id}" data-f="cur" aria-label="Currency">${curOpts(c.cur)}</select></div>
    <div class="two"><select data-cid="${c.id}" data-f="type" aria-label="Type">${typeOpts(c.type)}</select><button class="danger" data-act="delcat" data-id="${c.id}">Delete</button></div>
    ${c.type==='paid'?'':`<div class="muted small" id="left-${c.id}" style="margin-top:8px">${leftLine(c)}</div>`}
  </div>`;
  const pd=S.cats.filter(c=>c.type==='paid'),go=S.cats.filter(c=>c.type!=='paid');
  return `<h1>Budget</h1>
  <div class="card">
    <label for="total">Total trip budget (CAD)</label>
    <input id="total" inputmode="decimal" value="${S.total}">
    <div class="pv-rows" id="alloc" style="margin-top:10px">${allocHtml()}</div>
  </div>
  <div class="card"><label for="rate">Exchange rate (1 CAD = ? JPY)</label><input id="rate" inputmode="decimal" value="${S.rate}"></div>
  <div class="card">
    <label for="nc-name">Add a category</label>
    <input id="nc-name" placeholder="e.g. Shopping" maxlength="40" autocomplete="off">
    <div class="two"><input id="nc-amt" inputmode="decimal" placeholder="Amount"><select id="nc-cur">${curOpts('CAD')}</select></div>
    <div class="two"><select id="nc-type">${typeOpts('go')}</select><button class="btn primary" data-act="addcat">Add</button></div>
    ${S.cats.length?'':'<button class="btn" style="width:100%;margin-top:8px" data-act="starter">Add starter categories</button>'}
  </div>
  <h2>Already paid<span>amount you paid</span></h2>
  ${pd.map(row).join('')||'<p class="muted">Nothing yet.</p>'}
  <h2>On the go<span>budget to spend</span></h2>
  ${go.map(row).join('')||'<p class="muted">Nothing yet.</p>'}
  <h2>Data</h2>
  <div class="card">
    <p class="muted small" style="margin-top:0">Everything is stored on this device only. Export a backup before the trip and now and then during it. Last backup: ${S.lastBackup?new Date(S.lastBackup).toLocaleDateString():'never'}.</p>
    <div class="btnrow"><button data-act="export">Export backup</button><button data-act="importbtn">Import backup</button></div>
    <div class="btnrow"><button data-act="csv">Export CSV</button><button class="danger" data-act="reset">Erase all</button></div>
  </div>`;
}
function leftLine(c){
  const b=catBudget(c),s=expSpent(c.id);
  return `Spent ${money(s)} of ${money(b)} · ${leftText(b-s)}`;
}

/* ---------- render ---------- */
function render(){
  $('#hdr-seg').innerHTML=['CAD','JPY'].map(c=>`<button data-act="disp" data-v="${c}" class="${S.display===c?'on':''}">${c}</button>`).join('');
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  app.innerHTML=({summary:viewSummary,add:viewAdd,log:viewLog,budget:viewBudget})[tab]();
  if(tab==='add')updatePreview();
}
function setTab(t){tab=t;showNew=false;if(t!=='add'&&editing){editing=null;resetDraft();}render();window.scrollTo(0,0);}
function resetDraft(){draft={amount:'',cur:S.lastCur||'JPY',cat:draft.cat,desc:'',when:''};}

/* ---------- actions ---------- */
function saveExpense(){
  const amt=num(draft.amount,draft.cur);
  if(!(amt>0)){toast('Enter an amount');return;}
  if(!S.cats.find(c=>c.id===draft.cat)){toast('Pick a category');return;}
  const d=draft.when?new Date(draft.when):new Date();
  const rec={desc:draft.desc.trim(),amount:amt,cur:draft.cur,cat:draft.cat,ts:(isNaN(d)?new Date():d).toISOString()};
  if(editing){Object.assign(S.exps.find(e=>e.id===editing),rec);editing=null;}
  else S.exps.push(Object.assign({id:uid()},rec));
  S.lastCur=draft.cur;save();
  const wasEdit=!!document.querySelector('[data-act=cancel]');
  resetDraft();
  toast('Saved');
  if(wasEdit){tab='log';}
  render();window.scrollTo(0,0);
}
function download(name,text,type){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
const stamp=()=>new Date().toISOString().slice(0,10);
function csvCell(v){v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act],[data-tab]');if(!t)return;
  if(t.dataset.tab){setTab(t.dataset.tab);return;}
  const a=t.dataset.act,id=t.dataset.id;
  switch(a){
    case 'disp':S.display=t.dataset.v;save();render();break;
    case 'pick':editing=null;resetDraft();draft.cat=id;setTab('add');break;
    case 'curpick':
      draft.cur=t.dataset.v;
      document.querySelectorAll('#f-cur button').forEach(b=>b.classList.toggle('on',b.dataset.v===draft.cur));
      updatePreview();break;
    case 'save':saveExpense();break;
    case 'cancel':editing=null;resetDraft();setTab('log');break;
    case 'edit':{
      const x=S.exps.find(x=>x.id===id);if(!x)break;
      editing=id;draft={amount:String(x.amount),cur:x.cur,cat:x.cat,desc:x.desc,when:toLocalInput(x.ts)};
      tab='add';render();window.scrollTo(0,0);break;}
    case 'del':
      if(confirm('Delete this expense?')){S.exps=S.exps.filter(x=>x.id!==id);save();render();}break;
    case 'addcat':{
      const name=$('#nc-name').value.trim(),cur=$('#nc-cur').value;
      const amt=num($('#nc-amt').value||'0',cur);
      if(!name){toast('Name the category');return;}
      S.cats.push({id:uid(),name,budget:isFinite(amt)?amt:0,cur,type:$('#nc-type').value});
      save();render();toast('Category added');break;}
    case 'delcat':{
      const n=S.exps.filter(x=>x.cat===id).length;
      if(n){alert('This category has '+n+' expense'+(n===1?'':'s')+'. Move or delete them first (Log tab).');break;}
      if(confirm('Delete this category?')){S.cats=S.cats.filter(c=>c.id!==id);save();render();}break;}
    case 'starter':
      [['Flights','paid'],['Stays','paid'],['Visa','paid'],['Food','go'],['Transport','go'],['Shopping','go'],['Activities','go']]
        .forEach(([n,ty])=>S.cats.push({id:uid(),name:n,budget:0,cur:'CAD',type:ty}));
      save();render();break;
    case 'gotonew':{tab='budget';render();const el=$('#nc-name');if(el){el.scrollIntoView({block:'center'});el.focus();}break;}
    case 'newcat-toggle':{showNew=!showNew;render();const el=$('#qc-name');if(el)el.focus();break;}
    case 'qcreate':{
      const name=$('#qc-name').value.trim(),amt=num($('#qc-amt').value||'0','CAD');
      if(!name){toast('Name the category');return;}
      const c={id:uid(),name,budget:isFinite(amt)&&amt>=0?amt:0,cur:'CAD',type:'go'};
      S.cats.push(c);draft.cat=c.id;showNew=false;save();toast('Category added');render();break;}
    case 'export':S.lastBackup=Date.now();save();if(tab==='budget')render();download('trip-budget-'+stamp()+'.json',JSON.stringify(S,null,2),'application/json');break;
    case 'importbtn':$('#imp').click();break;
    case 'csv':{
      const nm=id=>(S.cats.find(c=>c.id===id)||{name:''}).name;
      const lines=['timestamp,description,category,amount,currency,cad,jpy'].concat(
        S.exps.slice().sort((a,b)=>a.ts.localeCompare(b.ts)).map(x=>{
          const c=toCad(x.amount,x.cur);
          return [x.ts,x.desc,nm(x.cat),x.amount,x.cur,c.toFixed(2),Math.round(c*S.rate)].map(csvCell).join(',');}));
      download('trip-expenses-'+stamp()+'.csv',lines.join('\n'),'text/csv');break;}
    case 'reset':
      if(confirm('Erase all categories and expenses on this device? Export a backup first.')){S=defaults();save();editing=null;draft={amount:'',cur:'JPY',cat:'',desc:'',when:''};render();}break;
  }
});
app.addEventListener('input',e=>{
  if(tab!=='add')return;
  const id=e.target.id;
  if(id==='f-amount')draft.amount=e.target.value;
  else if(id==='f-desc')draft.desc=e.target.value;
  else if(id==='f-when')draft.when=e.target.value;
  else if(id==='f-cat')draft.cat=e.target.value;
  else return;
  updatePreview();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='imp'){
    const f=t.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const d=JSON.parse(r.result);
        if(!Array.isArray(d.cats)||!Array.isArray(d.exps))throw 0;
        if(!confirm('Replace everything on this device with this backup?'))return;
        S=Object.assign(defaults(),d);save();render();toast('Backup restored');
      }catch(err){alert('That file is not a valid backup.');}
      t.value='';
    };
    r.readAsText(f);return;
  }
  if(t.id==='filter'){filterCat=t.value;render();return;}
  if(t.id==='total'){
    const v=num(t.value,'CAD');
    if(isFinite(v)&&v>=0){S.total=v;save();refreshAlloc();toast('Saved');}else t.value=S.total;
    return;
  }
  if(t.id==='rate'){
    const v=num(t.value,'CAD');
    if(v>0){S.rate=v;save();toast('Rate saved');S.cats.forEach(refreshLeft);refreshAlloc();}else t.value=S.rate;
    return;
  }
  if(t.dataset.cid){
    const c=S.cats.find(c=>c.id===t.dataset.cid);if(!c)return;
    const f=t.dataset.f;
    if(f==='name'){c.name=t.value.trim()||c.name;t.value=c.name;}
    else if(f==='budget'){const v=num(t.value,c.cur);c.budget=isFinite(v)&&v>=0?v:c.budget;t.value=c.budget;}
    else if(f==='cur')c.cur=t.value;
    else if(f==='type')c.type=t.value;
    save();
    if(f==='type')render();else{refreshLeft(c);refreshAlloc();}
  }
});
function refreshLeft(c){const el=document.getElementById('left-'+c.id);if(el&&c.type!=='paid')el.textContent=leftLine(c);}

function syncFromStorage(){
  if(!storageOK)return;
  try{
    const r=localStorage.getItem(KEY);
    if(r&&r!==lastRaw){
      S=Object.assign(defaults(),JSON.parse(r));lastRaw=r;
      if(editing&&!S.exps.find(x=>x.id===editing))editing=null;
      render();
    }
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncFromStorage();});
window.addEventListener('pageshow',syncFromStorage);
window.addEventListener('storage',syncFromStorage);
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});

banner();render();
})();
</script>
</body>
</html>
